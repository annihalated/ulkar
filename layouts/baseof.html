<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <title>{{ .Title }}{{ if not .IsHome }} — {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
    <meta name="author" content="{{ .Site.Params.author.name }}" />
    {{ $socialTitle := .Title }}
    {{ if .IsHome }}{{ $socialTitle = "Music and Social Order | A talk by Ulkar Aghayeva" }}{{ end }}
    <link rel="canonical" href="{{ .Permalink }}">
    <meta property="og:title" content="{{ $socialTitle }}">
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ "music-and-social-order.jpg" | absURL }}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1456">
    <meta property="og:image:height" content="661">
    <meta property="og:image:alt" content="Orpheus playing a lyre surrounded by animals in a wooded landscape.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ $socialTitle }}">
    <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="twitter:image" content="{{ "music-and-social-order.jpg" | absURL }}">
    <meta name="twitter:image:alt" content="Orpheus playing a lyre surrounded by animals in a wooded landscape.">

    {{ with resources.Get "css/global.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" />
    {{ end }}
  </head>
  <body>
    <main>{{ block "main" . }}{{ end }}</main>
  </body>
</html>
